<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Circuit Simulator</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #1e1e1e;
            color: white;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        h2 {
            margin-bottom: 10px;
            color: #4ec9b0;
        }
        canvas {
            background: #2d2d2d;
            border: 2px solid #555;
            cursor: crosshair;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        button {
            background-color: #0e639c;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 0.9rem;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1177bb;
        }
    </style>
</head>
<body>

    <h2>Circuit Canvas Sandbox & Waveform Viewer</h2>
    <canvas id="simCanvas" width="800" height="500"></canvas>
    
    <div class="controls">
        <button id="clearBtn">Clear Nodes</button>
        <button id="runPlotBtn">Run RC Simulation Plot</button>
    </div>

    <!-- Modular app script -->
    <script type="module" src="./app.js"></script>
</body>
</html>
